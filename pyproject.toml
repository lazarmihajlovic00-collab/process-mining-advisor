[project]
name = "process-mining-advisor"
version = "0.1.0"
description = "Process mining (pm4py) on purchase-to-pay event logs: discovery, conformance, bottlenecks, rework and an AI advisor (Gemini/Claude) that recommends automation with measured savings and human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pm4py>=2.7.11",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pma = "pmadvisor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pmadvisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
